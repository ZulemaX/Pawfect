services:
  db:
    image: postgres:16-alpine
    container_name: pawfect-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: pawfect
      POSTGRES_PASSWORD: pawfect_dev
      POSTGRES_DB: pawfect
    ports:
      - "5433:5432"
    volumes:
      - pawfect_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pawfect -d pawfect"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  pawfect_pgdata:
